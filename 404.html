<!-- Google Analytics 4 + Consent Mode v2 (UK/EU) -->
<script>
  // GA4 Measurement ID (change here if needed)
  window.GA_MEASUREMENT_ID = window.GA_MEASUREMENT_ID || 'G-CC2NRDSRQ9';

  // Consent state: 'accept' | 'reject' | null
  window.__dc_consent_choice = window.__dc_consent_choice || null;

  // GA load guard
  window.__ga_loaded = window.__ga_loaded || false;

  // DataLayer + gtag wrapper:
  // - Always allow Consent Mode commands
  // - Block analytics/events until user accepts
  window.dataLayer = window.dataLayer || [];
  function gtag(){
    try {
      if (arguments && arguments.length && arguments[0] === 'consent') {
        window.dataLayer.push(arguments);
        return;
      }
      if (window.__dc_consent_choice === 'accept') {
        window.dataLayer.push(arguments);
      }
    } catch(e) {}
  }
  window.gtag = window.gtag || gtag;

  // Helper: load GA script once (only call after consent 'accept')
  window.dcLoadGAOnce = window.dcLoadGAOnce || function() {
    var id = window.GA_MEASUREMENT_ID;
    if (window.__ga_loaded) return;
    if(!id || id === 'G-XXXXXXXXXX') {
      console.warn('GA4 ID is placeholder. Set window.GA_MEASUREMENT_ID to your real GA4 ID.');
      return;
    }
    // Avoid duplicate script tags
    if (!document.querySelector('script[src^="https://www.googletagmanager.com/gtag/js?id="]')) {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
      document.head.appendChild(s);
    }
    window.__ga_loaded = true;
    gtag('js', new Date());
    gtag('config', id, { anonymize_ip: true });
  };

  // Helper: attempt to clear GA cookies on "reject" (best-effort)
  window.dcClearGACookies = window.dcClearGACookies || function() {
    try {
      var expires = 'Thu, 01 Jan 1970 00:00:00 GMT';
      var domains = [location.hostname, '.' + location.hostname];
      function del(name) {
        // Host-only
        document.cookie = name + '=; expires=' + expires + '; path=/';
        // Explicit domains
        for (var i=0; i<domains.length; i++) {
          document.cookie = name + '=; expires=' + expires + '; path=/; domain=' + domains[i];
        }
      }
      document.cookie.split(';').forEach(function(c){
        var name = c.split('=')[0].trim();
        if(name === '_ga' || name === '_gid' || name.indexOf('_ga_') === 0 || name.indexOf('_gat') === 0) {
          del(name);
        }
      });
    } catch(e) {}
  };

  // Read saved consent and set defaults (Consent Mode v2)
  (function() {
    try {
      var saved = JSON.parse(localStorage.getItem('dc_consent') || '{}');
      var choice = (saved && (saved.choice === 'accept' || saved.choice === 'reject')) ? saved.choice : null;
      window.__dc_consent_choice = choice;

      var base = {
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        ad_storage: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted'
      };

      var consent = Object.assign({}, base, (choice === 'accept') ? {
        analytics_storage: 'granted',
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted'
      } : {});

      gtag('consent', 'default', consent);

      // Load GA only if user already accepted previously
      if (choice === 'accept') {
        window.dcLoadGAOnce();
      }
    } catch(e) { console.warn('Consent read failed', e); }
  })();
</script>
<!-- DC:GA4_CONSENT_HEAD_END -->

  .dc-btn{ border:1px solid #222; padding:8px 12px; border-radius:999px; background:#fff; cursor:pointer; font-size:14px; }
  .dc-btn--primary{ background:#222; color:#fff; }
  .dc-consent-manage{
    left: 12px !important;
    position:fixed;
    right:auto !important; bottom: 6px;
    z-index:2147483647;
    border:1px solid #222; background:#fff; padding:6px 10px; border-radius:999px; font-size:12px; cursor:pointer; opacity:.85;
    line-height:1; white-space:nowrap;
    transition: bottom .2s ease, right .2s ease, left .2s ease, opacity .2s;
  }
  /* When we need to lift above another fixed button (e.g., back-to-top) */
  /* Put it bottom-left on very small screens to avoid crowding */
  @media (max-width: 480px) {
    .dc-consent-manage{ left:16px; right:auto; }
  }
  .dc-consent-manage:hover{ opacity:1; }
</style>
<script>
(function(){
  try {
    // Create "Manage cookies" floating button
    var manage = document.createElement('button');
    manage.className = 'dc-consent-manage';
    manage.type = 'button';
    manage.textContent = 'Cookies';
    manage.setAttribute('aria-label','Manage cookies');
    manage.addEventListener('click', function(){ showBanner(true); });

    // Build banner
    function showBanner(force) {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem('dc_consent') || '{}'); } catch(e){}
      if(!force && saved && (saved.choice === 'accept' || saved.choice === 'reject')) return;
      var wrap = document.createElement('div');
      wrap.className = 'dc-consent-banner';
      wrap.setAttribute('role','dialog');
      wrap.setAttribute('aria-live','polite');
      wrap.innerHTML = ''
        + '<div class="dc-consent-banner__text">To keep things simple, we use essential cookies. If you’re happy, we’ll also use analytics to learn what’s working. You can update your choice anytime in “Cookies”.</div>'
        + '<div class="dc-consent-banner__btns">'
        +   '<button type="button" class="dc-btn" data-choice="reject">Reject non-essential</button>'
        +   '<button type="button" class="dc-btn dc-btn--primary" data-choice="accept">Accept all</button>'
        + '</div>';
      document.body.appendChild(wrap);
      wrap.querySelectorAll('button[data-choice]').forEach(function(btn){
        btn.addEventListener('click', function(){ setChoice(this.getAttribute('data-choice')); });
      });
    }

    function setChoice(choice) {
      try { localStorage.setItem('dc_consent', JSON.stringify({choice: choice})); } catch(e){}
      window.__dc_consent_choice = choice;

      // Update Consent Mode in real-time
      if (typeof gtag === 'function') {
        if(choice === 'accept') {
          gtag('consent', 'update', {
            analytics_storage: 'granted',
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted'
          });
          // Load GA once (no duplicates)
          if (typeof window.dcLoadGAOnce === 'function') {
            window.dcLoadGAOnce();
          }
        } else {
          gtag('consent', 'update', {
            analytics_storage: 'denied',
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied'
          });
          // Best-effort cookie cleanup
          if (typeof window.dcClearGACookies === 'function') {
            window.dcClearGACookies();
          }
        }
      }

      var b = document.querySelector('.dc-consent-banner'); if(b) b.remove();
    }

    // Try to avoid overlap with existing fixed "back to top" buttons
    function avoidOverlap() {
      try {
        var candidates = [
          '.back-to-top', '.scroll-to-top', '.scroll-top', '.to-top', '.btn-to-top',
          '#backToTop', '#toTop', '#totop', '[data-backtotop]', '[data-scroll-top]'
        ];
        var el = null;
        for (var i=0; i<candidates.length; i++) {
          var found = document.querySelector(candidates[i]);
          if(found) { el = found; break; }
        }
        // Reset
        manage.classList.remove('dc-lift');
        manage.style.right = ''; manage.style.left = ''; manage.style.bottom = '';
        // On small screens we already push left via CSS, skip overlap logic
        if (window.matchMedia('(max-width: 480px)').matches) return;
        if (!el) return;
        var r = el.getBoundingClientRect();
        // Heuristic: if the element sits bottom-right within 120px from the viewport edge, lift our button
        var nearBottom = (window.innerHeight - r.bottom) <= 120;
        var nearRight  = (window.innerWidth  - r.right)  <= 120;
        var visible = r.width>0 && r.height>0;
        if (visible && nearBottom && nearRight) {
          // // manage.classList.add('dc-lift'); // disabled // disabled
        }
      } catch(e){}
    }

    document.addEventListener('DOMContentLoaded', function(){
      document.body.appendChild(manage);
      showBanner(false);
      avoidOverlap();
    });
    window.addEventListener('scroll', avoidOverlap, {passive:true});
    window.addEventListener('resize', avoidOverlap);

    // Run a few times shortly after load to catch late-mounted widgets
    setTimeout(avoidOverlap, 300);
    setTimeout(avoidOverlap, 1000);
  } catch(e){ console.error('Consent banner error', e); }
})();
</script>
<!-- DC:CONSENT_BANNER_END -->
