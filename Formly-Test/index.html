<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formly Minimal Test | Dreamy Cake</title>
  <style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.5}label{display:block;margin-top:16px;font-weight:600}input,textarea,button{font:inherit;width:100%;padding:10px;margin-top:6px;box-sizing:border-box}button{width:auto;margin-top:20px;cursor:pointer}.note{background:#fff7d7;border:1px solid #eed27a;padding:12px;border-radius:8px}</style>
</head>
<body>
  <h1>Formly Minimal Test</h1>
  <p class="note">This unlinked noindex page is for testing Formly only. It uses the exact minimal setup from Formly docs: endpoint, POST, access_key and normal named fields. No redirect, no metadata, no honeypot, no JavaScript and no file upload.</p>
  <form action="https://formly.email/submit" method="POST">
    <input type="hidden" name="access_key" value="8c20c8e2b11242a586b585700f820946">
    <label for="t-name">Name</label>
    <input id="t-name" type="text" name="name" required>
    <label for="t-email">Email</label>
    <input id="t-email" type="email" name="email" required>
    <label for="t-message">Message</label>
    <textarea id="t-message" name="message" rows="5" required></textarea>
    <button type="submit">Send minimal test</button>
  </form>
</body>
</html>
